name: Sarrifli
options:
  bundleIdPrefix: com.alsaqi
  deploymentTarget: { iOS: "15.0" }
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.4.0
targets:
  Sarrifli:
    type: application
    platform: iOS
    sources:
      - path: Sarrifli
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alsaqi.sarrifli
        PRODUCT_NAME: Sarrifli
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sarrifli/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sarrifli/Sarrifli.entitlements
        SWIFT_VERSION: "5.0"
