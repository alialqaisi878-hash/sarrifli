# Builds the Android app (unsigned) and puts the files on the "builds" branch; they are signed afterwards with the owner's key.
name: android
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: python3 android/make-www.py
      - run: gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - if: always()
        run: |
          mkdir -p out && cp build.log out/ || true
          cp android/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/commit.txt
          cd out && git init -q && git checkout -q -b builds && git add -A
          git -c user.name=build -c user.email=build@users.noreply.github.com commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
